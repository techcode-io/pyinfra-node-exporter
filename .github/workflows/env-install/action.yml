---
name: Environment installation
description: Install python, uv, and dependencies

inputs:
  docker:
    description: Set up QEMU and Docker Buildx (only needed for container build/push jobs)
    required: false
    default: "false"

runs:
  using: "composite"
  steps:
    - name: Set up QEMU
      if: runner.os == 'Linux' && inputs.docker == 'true'
      uses: techcode-io/github-actions/setup-qemu@setup-qemu/v1

    - name: Set up Docker Buildx
      if: runner.os == 'Linux' && inputs.docker == 'true'
      uses: techcode-io/github-actions/setup-buildx@setup-buildx/v1

    - name: Install uv
      uses: techcode-io/github-actions/setup-uv@setup-uv/v1

    - name: Install dependencies
      run: |
        # Enable frozen mode to avoid updating `uv.lock` in CI
        echo "UV_FROZEN=true" >> "${GITHUB_ENV}"
        uv sync
        uv run poe env:configure
      shell: "bash"
