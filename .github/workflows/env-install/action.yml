---
name: Environment installation
description: Install python, uv, and dependencies

inputs:
  docker:
    description: Set up QEMU and Docker Buildx (only needed for container build/push jobs)
    required: false
    default: "false"

runs:
  using: "composite"
  steps:
    - name: Set up QEMU
      if: runner.os == 'Linux' && inputs.docker == 'true'
      uses: docker/setup-qemu-action@v4

    - name: Set up Docker Buildx
      if: runner.os == 'Linux' && inputs.docker == 'true'
      uses: docker/setup-buildx-action@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v9

    - name: Install dependencies
      run: |
        # Enable frozen mode to avoid updating `uv.lock` in CI
        echo "UV_FROZEN=true" >> "${GITHUB_ENV}"
        uv sync
        uv run poe env:configure
      shell: "bash"
